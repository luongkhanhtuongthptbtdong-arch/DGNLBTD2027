.tag.ok{background:var(--ok-soft);color:var(--ok)}

.filt{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}

.panel{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
.tbl{overflow-x:auto}

.chk{display:flex;gap:16px;margin-top:6px;flex-wrap:wrap}

textarea.in{min-height:90px;font-family:ui-monospace,Consolas,monospace;font-size:.85rem}

@media (max-width:900px){

@media print{.top,.side,.nav{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

"use strict";
/* ================= LÕI: RNG + ĐỊNH DẠNG ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
class Rng{
  constructor(s){this.r=mulberry32(s>>>0);}
  f(){return this.r();}
  i(a,b){return a+Math.floor(this.r()*(b-a+1));}
  nz(a,b){let v;do{v=this.i(a,b);}while(v===0);return v;}
  pick(a){return a[Math.floor(this.r()*a.length)];}
  shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(this.r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  sample(a,k){return this.shuffle(a).slice(0,k);}
  bool(){return this.r()<0.5;}
}
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;};
const C=(n,k)=>{if(k<0||k>n)return 0;let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return Math.round(r);};
/* số -> chuỗi kiểu Việt Nam (dấu phẩy thập phân, dấu trừ thật) */
function nf(x,d){
  if(d===undefined)d=4;
  let v=Math.round(x*Math.pow(10,d))/Math.pow(10,d);
  if(Object.is(v,-0))v=0;
  let s=String(Math.abs(v));
  if(s.indexOf("e")>=0)s=Math.abs(v).toFixed(d).replace(/0+$/,"").replace(/\.$/,"");
  return (v<0?"−":"")+s.replace(".",",");
}
function fr(p,q){ if(q<0){p=-p;q=-q;} const g=gcd(p,q); p/=g;q/=g; return q===1?nf(p):(p<0?"−":"")+Math.abs(p)+"/"+q; }
function frv(p,q){return p/q;}
/* đa thức: [[hệ số,'x³'],...] */
function poly(terms){
  let s="";
  for(const [c,v] of terms){
    if(c===0)continue;
    const a=Math.abs(c);
    const coef=(a===1&&v)?"":nf(a);
    if(s==="")s=(c<0?"−":"")+coef+v;
    else s+=(c<0?" − ":" + ")+coef+v;
  }
  return s||"0";
}
const sgn=(c)=>c<0?" − "+nf(-c):" + "+nf(c);       /* " + 3" / " − 3" */
const sgn0=(c)=>c===0?"":sgn(c);
const pw=(b,e)=>b+"<sup>"+e+"</sup>";
const sub=(b,e)=>b+"<sub>"+e+"</sub>";
function sqrtFrac(num,den,r){ /* num√r/den */
  const g=gcd(num,den); num/=g; den/=g;
  const head=(num===1?"":nf(num))+"√"+r;
  return den===1?head:head+"/"+den;
}
/* ============ DỰNG CÂU HỎI ============ */
const FILLER=["Không xác định","Vô số","Không tồn tại"];
function MC(R,stem,correct,wrongs,expl){
  const c=String(correct);const seen=new Set([c]);const w=[];
  for(const x of wrongs){const s=String(x);if(!seen.has(s)){seen.add(s);w.push(s);}if(w.length===3)break;}
  for(const f of FILLER){if(w.length>=3)break;if(!seen.has(f)){seen.add(f);w.push(f);}}
  const opts=R.shuffle([c,...w]);
  return {type:"mc",stem,opts,ans:opts.indexOf(c),expl:expl||""};
}
/* trắc nghiệm số: tự bù phương án nhiễu nếu trùng */
function MCn(R,stem,c,wrongs,expl,fmt){
  fmt=fmt||(x=>nf(x));
  const cs=fmt(c);const seen=new Set([cs]);const w=[];
  for(const x of wrongs){if(x===undefined||!isFinite(x))continue;const s=fmt(x);if(!seen.has(s)){seen.add(s);w.push(s);}if(w.length===3)break;}
  let k=1,guard=0;
  const step=Math.abs(c)>=20?Math.max(1,Math.round(Math.abs(c)/10)):1;
  while(w.length<3&&guard<60){guard++;const x=c+(k%2?1:-1)*Math.ceil(k/2)*step;k++;const s=fmt(x);if(!seen.has(s)){seen.add(s);w.push(s);}}
  const opts=R.shuffle([cs,...w]);
  return {type:"mc",stem,opts,ans:opts.indexOf(cs),expl:expl||""};
}
function SA(stem,ans,expl,tol){return {type:"sa",stem,ans,tol:tol===undefined?0.005:tol,expl:expl||""};}
/* Đúng/Sai: items [{t,v}] */
function DS(stem,items,expl){return {type:"ds",stem,items,expl:expl||""};}
/* Ghép hợp: left[4], right[n], key[i]=chỉ số right đúng */
function GH(R,stem,pairs,extras,expl){
  const right=R.shuffle([...pairs.map(p=>p[1]),...extras]);
  const uniq=[...new Set(right)];
  return {type:"gh",stem,left:pairs.map(p=>p[0]),right:uniq,key:pairs.map(p=>uniq.indexOf(p[1])),expl:expl||""};
}
/* chọn mệnh đề đúng hoặc sai ngẫu nhiên */
function tf(R,trueText,falseText){return R.bool()?{t:trueText,v:true}:{t:falseText,v:false};}
function table(head,rows){
  let h='<div class="tw"><table class="dt"><tr>'+head.map(x=>"<th>"+x+"</th>").join("")+"</tr>";
  for(const r of rows)h+="<tr>"+r.map(x=>"<td>"+x+"</td>").join("")+"</tr>";
  return h+"</table></div>";
}
/* ================= TOÁN HỌC (V-ACT, 30 câu) ================= */
const MATH=[
function(R){ /* đạo hàm tại điểm */
  const a=R.nz(-3,3),b=R.nz(-4,4),c=R.i(-6,6),d=R.i(-9,9),x=R.nz(-2,2);
  const v=3*a*x*x+2*b*x+c;
  return MCn(R,`Cho hàm số f(x) = ${poly([[a,"x³"],[b,"x²"],[c,"x"],[d,""]])}. Giá trị của f′(${nf(x)}) bằng`,v,
   [a*x*x*x+b*x*x+c*x+d,3*a*x*x+b*x+c,v+d,-v],
   `f′(x) = ${poly([[3*a,"x²"],[2*b,"x"],[c,""]])} ⇒ f′(${nf(x)}) = ${nf(v)}.`);
},
function(R){ /* giá trị cực đại hàm bậc ba */
  const k=R.i(1,3),q=R.i(-8,8),v=2*k*k*k+q;
  return MCn(R,`Giá trị cực đại của hàm số y = ${poly([[1,"x³"],[-3*k*k,"x"],[q,""]])} bằng`,v,[q-2*k*k*k,-k,k,2*k*k*k-q],
   `y′ = 3x² − ${3*k*k} = 0 ⇔ x = ±${k}. y′ đổi dấu từ + sang − tại x = −${k} nên y<sub>CĐ</sub> = y(−${k}) = ${nf(v)}.`);
},
function(R){ /* phương trình logarit */
  const a=R.pick([2,3,5]),cmax=a===2?4:a===3?3:2,c=R.i(1,cmax),b=R.i(-5,5),x=Math.pow(a,c)-b;
  const inside=b===0?"x":"x"+sgn(b);
  return MCn(R,`Nghiệm của phương trình log${"<sub>"+a+"</sub>"}(${inside}) = ${c} là`,x,[Math.pow(a,c)+b,c*a-b,Math.pow(a,c),Math.pow(c,a)-b],
   `Điều kiện ${inside} > 0. Phương trình ⇔ ${inside} = ${a}<sup>${c}</sup> = ${Math.pow(a,c)} ⇔ x = ${nf(x)} (thỏa mãn).`);
},
function(R){ /* phương trình mũ */
  const a=R.pick([2,3,5]),cmax=a===2?5:a===3?4:3,c=R.i(0,cmax),x0=R.i(-2,3),p=c-2*x0;
  const e=p===0?"2x":"2x"+sgn(p);
  return MCn(R,`Nghiệm của phương trình ${a}<sup>${e}</sup> = ${Math.pow(a,c)} là`,x0,[x0+1,(c+p)/2,c,x0-1],
   `${Math.pow(a,c)} = ${a}<sup>${c}</sup> nên ${e} = ${c} ⇔ x = ${nf(x0)}.`);
},
function(R){ /* tích phân */
  const a=R.nz(1,4),b=R.i(-5,5),n=R.i(1,4),v=a*n*n+b*n;
  return MCn(R,`Tích phân ∫<sub>0</sub><sup>${n}</sup> (${poly([[2*a,"x"],[b,""]])}) dx bằng`,v,[2*a*n*n+b*n,a*n+b,a*n*n+b,a*n*n],
   `∫<sub>0</sub><sup>${n}</sup> (${poly([[2*a,"x"],[b,""]])}) dx = (${poly([[a,"x²"],[b,"x"]])})|<sub>0</sub><sup>${n}</sup> = ${nf(v)}.`);
},
function(R){ /* tổng cấp số cộng */
  const u=R.i(-5,10),d=R.nz(-3,5),n=R.i(8,20),S=n*(2*u+(n-1)*d)/2;
  return MCn(R,`Cho cấp số cộng (u<sub>n</sub>) có u<sub>1</sub> = ${nf(u)} và công sai d = ${nf(d)}. Tổng ${n} số hạng đầu tiên bằng`,S,[n*(u+(n-1)*d),Math.round(n*(2*u+n*d)/2),u+(n-1)*d,S+d],
   `S<sub>${n}</sub> = ${n}[2u<sub>1</sub> + ${n-1}d]/2 = ${n}·(${nf(2*u)} + ${nf((n-1)*d)})/2 = ${nf(S)}.`);
},
function(R){ /* số hạng cấp số nhân */
  const u=R.nz(-3,3),q=R.pick([2,3,-2]),n=R.i(4,7),v=u*Math.pow(q,n-1);
  return MCn(R,`Cho cấp số nhân (u<sub>n</sub>) có u<sub>1</sub> = ${nf(u)}, công bội q = ${nf(q)}. Giá trị u<sub>${n}</sub> bằng`,v,[u*Math.pow(q,n),u*Math.pow(q,n-2),u*q*(n-1),-v],
   `u<sub>${n}</sub> = u<sub>1</sub>·q<sup>${n-1}</sup> = ${nf(u)}·(${nf(q)})<sup>${n-1}</sup> = ${nf(v)}.`);
},
function(R){ /* tổ hợp chọn ban */
  const m=R.i(5,9),w=R.i(4,8),a=R.i(1,3),b=R.i(1,3),v=C(m,a)*C(w,b);
  return MCn(R,`Một lớp có ${m} học sinh nam và ${w} học sinh nữ. Số cách chọn ra ${a} nam và ${b} nữ để tham gia đội văn nghệ là`,v,[C(m,a)+C(w,b),C(m+w,a+b),2*v,C(m,b)*C(w,a)],

function(R){ /* trung bình / trung vị */

function(R){ /* quy luật dãy số */

},
function(R){ /* tam đoạn luận */

  if(t===1)return MC(R,`Cho các tiền đề: “Mọi ${X} đều là ${Y}.” và “Không có ${Y} nào là ${Z}.” Kết luận nào sau đây chắc chắn đúng?`,

function(R){ /* ai nói thật */
  const P=R.sample(NAMES,3);
  for(let tries=0;tries<300;tries++){
    const st=[];for(let s=0;s<3;s++){const ty=R.i(0,2);st.push({ty,tg:ty===2?s:R.i(0,2)});}
    if(st.some((x,s)=>x.ty!==2&&x.tg===s))continue;
    const mode=R.bool()?1:2; /* 1: chỉ một người nói thật; 2: chỉ một người nói dối */

    if(sol.length!==1)continue;
    const say=st.map((x,s)=>`${P[s]} nói: “${x.ty===0?P[x.tg]+" làm vỡ":x.ty===1?"Không phải "+P[x.tg]+" làm vỡ":"Không phải tôi làm vỡ"}”`).join("; ");
    return MC(R,`Một trong ba bạn ${P.join(", ")} đã làm vỡ cửa kính. ${say}. Biết rằng ${mode===1?"chỉ có đúng một bạn nói thật":"chỉ có đúng một bạn nói dối"}. Bạn làm vỡ cửa kính là`,
      P[sol[0]],[...P.filter((_,i)=>i!==sol[0]),"Không xác định được"],`Thử lần lượt từng bạn là người làm vỡ, chỉ trường hợp ${P[sol[0]]} cho đúng số người nói thật theo giả thiết.`);
  }
  return LOGIC[0](R);
},
function(R){ /* ngày trong tuần */

function planIdx(S,n,len){const o=[];while(o.length<len)o.push(...S.shuffle([...Array(n).keys()]));return o.slice(0,len);}
function fillSec(S,R,gens,len,sec,part){
  const idx=planIdx(S,gens.length,len);const out=[];const seen=new Set();
  for(const i of idx){let q,t=0;do{q=gens[i](R);t++;}while(seen.has(q.stem)&&t<15);seen.add(q.stem);q.sec=sec;if(part)q.part=part;out.push(q);}
  return out;
}
function buildExam(exam,de,nonce){
  const S=new Rng(de*7919+(exam==="vact"?101:707));const R=new Rng(nonce);
  if(exam==="vact"){
    return [
      ...fillSec(S,R,TV,30,"Tiếng Việt"),
      ...fillSec(S,R,TA,30,"Tiếng Anh"),
      ...fillSec(S,R,MATH,30,"Toán học"),
      ...fillSec(S,R,LOGIC,6,"Tư duy khoa học","Logic"),
      ...fillSec(S,R,DATA,6,"Tư duy khoa học","Phân tích số liệu"),
      ...fillSec(S,R,SCI,18,"Tư duy khoa học","Suy luận khoa học")

  }
  return [
    ...fillSec(S,R,VDS,15,"Đúng/Sai"),

function parseNum(s){
  if(s===undefined||s===null)return NaN;
  s=String(s).trim().replace(/\s/g,"").replace(/−/g,"-").replace(/,/g,".");
  if(s==="")return NaN;
  if(/^-?\d+(\.\d+)?\/-?\d+(\.\d+)?$/.test(s)){const [a,b]=s.split("/").map(Number);return b===0?NaN:a/b;}
  if(!/^-?\d*\.?\d+$/.test(s))return NaN;
  return Number(s);
}
/* trả về {score,max,secs:{name:{s,m,c,n}},per:[{ok,pts,max}]} */
function gradeExam(exam,qs,ans){
  const secs={};const per=[];let score=0,max=0;
  qs.forEach((q,i)=>{
    const a=ans[i];let pts=0,mx=0,ok=false;
    if(q.type==="mc"){mx=10;ok=a===q.ans;pts=ok?10:0;}
    else if(q.type==="ds"){mx=6;let c=0;q.items.forEach((it,j)=>{if(a&&a[j]!==undefined&&a[j]!==null&&a[j]===it.v)c++;});pts=c*1.5;ok=c===4;}
    else if(q.type==="gh"){mx=6;let c=0;q.key.forEach((k,j)=>{if(a&&a[j]===k)c++;});pts=c*1.5;ok=c===4;}
    else if(q.type==="sa"){mx=6;const v=parseNum(a);ok=isFinite(v)&&Math.abs(v-q.ans)<=Math.max(q.tol,1e-9);pts=ok?6:0;}
    const s=secs[q.sec]||(secs[q.sec]={s:0,m:0,c:0,n:0});s.s+=pts;s.m+=mx;s.n++;if(ok)s.c++;
    score+=pts;max+=mx;per.push({ok,pts,max:mx});
  });
  return {score:Math.round(score*10)/10,max,secs,per};
}

     <div class="legend"><span class="bub f" style="width:12px;height:12px"></span> đã trả lời &nbsp; <span class="bub" style="width:12px;height:12px"></span> chưa trả lời &nbsp; chấm đỏ: đánh dấu xem lại</div>
    </aside></div></div>`;
  bindOut();
  $("#sub").onclick=()=>{const left=qs.filter((q,i)=>!answered(i)).length;
    const d=modal(`<h3>Nộp bài?</h3><p>${left?`Còn <b>${left}</b> câu chưa trả lời.`:"Bạn đã trả lời tất cả các câu."}</p><div class="nav"><button class="btn red" id="ok">Nộp bài</button><button class="btn ghost" id="no">Làm tiếp</button></div>`);
    d.querySelector("#no").onclick=()=>d.remove();d.querySelector("#ok").onclick=()=>{d.remove();finish();};};
  $("#tp").onclick=()=>$("#side").classList.toggle("closed");
  if(window.innerWidth<900)$("#side").classList.add("closed");
  renderPal();renderQ();
  clearInterval(TIMER);const end=p.start+E.time*60000;
  const tick=()=>{const ms=end-Date.now();if(ms<=0){clearInterval(TIMER);finish();return;}const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);const t=$("#tm");if(t){t.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");t.classList.toggle("low",ms<5*60000);}};
  tick();TIMER=setInterval(tick,1000);
}
function answered(i){const a=EX.p.ans[i];const q=EX.qs[i];if(a===undefined||a===null)return false;
  if(q.type==="ds"||q.type==="gh")return Array.isArray(a)&&a.filter(x=>x!==null&&x!==undefined).length===4;
  if(q.type==="sa")return String(a).trim()!=="";return true;}
function renderPal(){
  let h="",last="";
  EX.qs.forEach((q,i)=>{const g=q.part?q.sec+" – "+q.part:q.sec;if(g!==last){if(last)h+="</div>";h+=`<h4>${g}</h4><div class="palg">`;last=g;}
    h+=`<button class="pb${answered(i)?" a":""}${EX.p.cur===i?" cur":""}${EX.p.fl[i]?" fl":""}" data-i="${i}" aria-label="Câu ${i+1}">${i+1}</button>`;});
  $("#pal").innerHTML=h+"</div>";
  $("#pal").querySelectorAll(".pb").forEach(b=>b.onclick=()=>{EX.p.cur=+b.dataset.i;saveProg();renderPal();renderQ();if(window.innerWidth<900)$("#side").classList.add("closed");});
}
const L="ABCDEFGH";
function renderQ(){
  const i=EX.p.cur,q=EX.qs[i],a=EX.p.ans[i];
  let body="";
  if(q.type==="mc")body=`<div class="opts">${q.opts.map((o,j)=>`<button class="opt${a===j?" sel":""}" data-j="${j}"><span class="bub">${L[j]}</span><span>${o}</span></button>`).join("")}</div>`;
  else if(q.type==="ds")body=q.items.map((it,j)=>`<div class="dsr"><div><b>${"abcd"[j]})</b> ${it.t}</div><div class="tfb" data-j="${j}"><button data-v="1" class="${a&&a[j]===true?"on":""}">Đúng</button><button data-v="0" class="${a&&a[j]===false?"on":""}">Sai</button></div></div>`).join("");
  else if(q.type==="gh")body=`<div class="ghopt">${q.right.map((r,k)=>`<div><b>${L[k]}.</b> ${r}</div>`).join("")}</div>`+q.left.map((l,j)=>`<div class="ghr"><div><b>${j+1}.</b> ${l}</div><select class="in" data-j="${j}"><option value="">– chọn –</option>${q.right.map((r,k)=>`<option value="${k}"${a&&a[j]===k?" selected":""}>${L[k]}</option>`).join("")}</select></div>`).join("");
  else body=`<label class="l" for="sa">Nhập đáp số (số nguyên, số thập phân dùng dấu phẩy, hoặc phân số a/b)</label><input class="in" id="sa" style="max-width:240px" inputmode="decimal" value="${esc(a||"")}">`;
  $("#qb").innerHTML=`<div class="qhead"><span class="qno">Câu ${i+1}</span><span class="qsec">${q.sec}${q.part?" · "+q.part:""}</span></div>
   <div class="stem">${q.stem}</div>${body}
   <div class="nav"><button class="btn ghost" id="pv" ${i===0?"disabled":""}>Câu trước</button><button class="btn" id="nx" ${i===EX.qs.length-1?"disabled":""}>Câu sau</button><button class="btn ghost" id="fg">${EX.p.fl[i]?"Bỏ đánh dấu":"Đánh dấu xem lại"}</button></div>`;
  const set=v=>{EX.p.ans[i]=v;saveProg();renderPal();};
  $("#qb").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{set(+b.dataset.j);renderQ();});
  $("#qb").querySelectorAll(".tfb button").forEach(b=>b.onclick=()=>{const j=+b.parentNode.dataset.j;const arr=Array.isArray(EX.p.ans[i])?EX.p.ans[i].slice():[null,null,null,null];arr[j]=b.dataset.v==="1";set(arr);renderQ();});
  $("#qb").querySelectorAll("select").forEach(s=>s.onchange=()=>{const j=+s.dataset.j;const arr=Array.isArray(EX.p.ans[i])?EX.p.ans[i].slice():[null,null,null,null];arr[j]=s.value===""?null:+s.value;set(arr);});
  const sa=$("#sa");if(sa)sa.oninput=()=>set(sa.value);
  $("#pv").onclick=()=>{EX.p.cur--;saveProg();renderPal();renderQ();};
  $("#nx").onclick=()=>{EX.p.cur++;saveProg();renderPal();renderQ();};
  $("#fg").onclick=()=>{EX.p.fl[i]=!EX.p.fl[i];saveProg();renderPal();renderQ();};
  window.scrollTo({top:0});
}
async function finish(){
  clearInterval(TIMER);
  const p=EX.p,qs=EX.qs;const ans=qs.map((_,i)=>p.ans[i]);
  const g=gradeExam(p.exam,qs,ans);
  const used=Math.min(EXAMS[p.exam].time*60,Math.round((Date.now()-p.start)/1000));
  const rec={u:ME.u,exam:p.exam,de:p.de,nonce:p.nonce,score:g.score,max:g.max,used,ans};
  ls.del(K.prog+ME.u);
  busy(true,"Đang lưu kết quả lên máy chủ…");
  const payload={u:ME.u,exam:p.exam,de:p.de,score:g.score,minutes:Math.round(used/60),secs:Object.fromEntries(Object.entries(g.secs).map(([k,s])=>[k,s.s+"/"+s.m])),nonce:p.nonce};
  const r=await api("submit",payload);busy(false);
  if(!r.ok){const pd=ls.get(K.pend,[]);pd.push(payload);ls.set(K.pend,pd);}
  viewResult(rec,qs,g);
  if(!r.ok)modal(`<h3>Chưa lưu được lên máy chủ</h3><p>${esc(r.err)}</p><p>Kết quả đã được giữ trên máy này và sẽ tự gửi lại ở lần đăng nhập sau.</p>`);
}
/* ================= KẾT QUẢ ================= */
function ansText(q,a){
  if(q.type==="mc")return a===undefined||a===null?"(bỏ trống)":L[a]+". "+q.opts[a];
  if(q.type==="ds")return q.items.map((it,j)=>"abcd"[j]+") "+(a&&a[j]!=null?(a[j]?"Đ":"S"):"–")).join("  ");
  if(q.type==="gh")return q.left.map((_,j)=>(j+1)+"–"+(a&&a[j]!=null?L[a[j]]:"?")).join("  ");
  return a&&String(a).trim()?esc(a):"(bỏ trống)";
}
function keyText(q){
  if(q.type==="mc")return L[q.ans]+". "+q.opts[q.ans];
  if(q.type==="ds")return q.items.map((it,j)=>"abcd"[j]+") "+(it.v?"Đúng":"Sai")).join("  ");
  if(q.type==="gh")return q.key.map((k,j)=>(j+1)+"–"+L[k]).join("  ");
  return nf(q.ans,4);
}
function viewResult(rec,qs,g){
  const E=EXAMS[rec.exam];let filter="all";
  const secHtml=Object.entries(g.secs).map(([k,s])=>`<div style="display:flex;justify-content:space-between;font-size:.92rem"><span>${k}</span><b>${nf(s.s)}/${s.m}</b></div><div class="bar"><i style="width:${s.m?s.s/s.m*100:0}%"></i></div>`).join("");
  const conv=rec.exam==="vsat"?`<p style="color:var(--graphite);font-size:.9rem">Quy đổi tham khảo thang 10 (tuyến tính): <b>${nf(rec.score/15,2)}</b>. Các trường quy đổi chính thức theo bảng bách phân vị riêng.</p>`
   :`<p style="color:var(--graphite);font-size:.9rem">Điểm tính 10 điểm/câu đúng. Kỳ thi thật dùng trọng số theo độ khó (IRT) nên điểm thật có thể lệch đôi chút.</p>`;
  const draw=()=>{
    const list=qs.map((q,i)=>({q,i,ok:g.per[i].ok,pts:g.per[i].pts,mx:g.per[i].max})).filter(x=>filter==="all"||(filter==="no"?!x.ok:x.ok));
    $("#rvl").innerHTML=list.map(({q,i,ok,pts,mx})=>`<div class="rv ${ok?"ok":"no"}"><div class="qhead" style="margin-bottom:8px"><span class="qno" style="font-size:1rem">Câu ${i+1}</span><span><span class="tag ${ok?"ok":""}">${nf(pts)}/${mx} điểm</span> <span class="qsec">${q.sec}</span></span></div>
      <div class="stem" style="font-size:1rem">${q.stem}</div>
      ${q.type==="ds"?q.items.map((it,j)=>`<div style="font-family:var(--fs)">${"abcd"[j]}) ${it.t}</div>`).join(""):""}
      ${q.type==="gh"?`<div class="ghopt">${q.right.map((r,k)=>`<div><b>${L[k]}.</b> ${r}</div>`).join("")}</div>`+q.left.map((l,j)=>`<div style="font-family:var(--fs)">${j+1}. ${l}</div>`).join(""):""}
      <div class="k">Bạn chọn: <b>${ansText(q,rec.ans[i])}</b></div><div class="k">Đáp án: <b style="color:var(--ok)">${keyText(q)}</b></div>
      ${q.expl?`<div class="expl"><b>Lời giải.</b> ${q.expl}</div>`:""}</div>`).join("")||`<p>Không có câu nào trong mục này.</p>`;
  };
  app().innerHTML=topbar()+`<div class="wrap"><div class="res"><div class="score">
    <div style="color:var(--graphite)">${E.name} · Đề ${String(rec.de).padStart(2,"0")}</div>
    <div class="big">${nf(rec.score)}<small> / ${E.max}</small></div>
    <p style="margin:.4em 0 1em">Đúng hoàn toàn ${g.per.filter(x=>x.ok).length}/${qs.length} câu · ${Math.round(rec.used/60)} phút</p>
    ${secHtml}${conv}
    <div class="nav"><button class="btn red" id="again">Làm lại đề này (số liệu mới)</button><button class="btn ghost" id="home">Về trang chọn đề</button><button class="btn ghost" id="pr">In kết quả</button></div>
   </div><div><h2 style="font-size:1.4rem">Xem lại bài làm</h2><div class="filt"><button class="btn sm" data-f="all">Tất cả</button><button class="btn ghost sm" data-f="no">Câu sai / chưa trọn điểm</button><button class="btn ghost sm" data-f="ok">Câu đúng</button></div><div id="rvl"></div></div></div></div>`;
  bindOut();
  app().querySelectorAll(".filt button").forEach(b=>b.onclick=()=>{filter=b.dataset.f;app().querySelectorAll(".filt button").forEach(x=>x.className="btn sm"+(x===b?"":" ghost"));draw();});
  $("#again").onclick=()=>confirmStart(rec.exam,rec.de);
  $("#home").onclick=viewHome;$("#pr").onclick=()=>window.print();
  draw();window.scrollTo({top:0});
}
/* ================= QUẢN TRỊ ================= */
function download(name,text,type){const b=new Blob([text],{type:type||"text/plain"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
async function viewAdmin(){
  clearInterval(TIMER);
  app().innerHTML=topbar(`<button class="btn ghost sm" id="try">Vào thi thử</button>`)+`<div class="wrap"><p>Đang tải dữ liệu từ máy chủ…</p></div>`;bindOut();
  const [U,Rs]=await Promise.all([api("users"),api("results",{limit:500})]);
  if(!U.ok){if(/đăng nhập|hết hạn/.test(U.err||""))return viewLogin(U.err);}
  const rows=U.ok?U.list:[],res=Rs.ok?Rs.list:[];
  app().innerHTML=topbar(`<button class="btn ghost sm" id="try">Vào thi thử</button>`)+`<div class="wrap">
   <h2 style="font-size:1.6rem">Quản trị – bản online</h2>
   ${ADMIN_DEF?`<div class="panel" style="border-color:var(--form)"><b>Đang dùng mật khẩu quản trị mặc định.</b> Đổi ngay ở cuối trang.</div>`:""}
   ${!U.ok?`<div class="panel" style="border-color:var(--form)">${esc(U.err)}</div>`:""}
   <div class="panel"><h3>Cấp tài khoản</h3>
    <div class="row2"><div><label class="l">Tên đăng nhập</label><input class="in" id="nu" placeholder="vd: hs12a01"></div>
     <div><label class="l">Mật khẩu</label><input class="in" id="np"></div>
     <div><label class="l">Họ và tên</label><input class="in" id="nn"></div>
     <div><label class="l">Hạn sử dụng (để trống = không giới hạn)</label><input class="in" id="ne" type="date"></div></div>
    <div class="chk"><label><input type="checkbox" id="r1" checked> V-ACT</label><label><input type="checkbox" id="r2" checked> V-SAT Toán</label></div>
    <div class="nav"><button class="btn red" id="add">Tạo tài khoản</button></div>
    <details style="margin-top:12px"><summary>Tạo hàng loạt (dán từ Excel)</summary><p style="font-size:.9rem;color:var(--graphite)">Mỗi dòng: tên đăng nhập, mật khẩu, họ tên — ngăn cách bằng dấu phẩy hoặc phím Tab (chép thẳng 3 cột từ Excel). Quyền và hạn lấy theo ô phía trên.</p><textarea class="in" id="bulk" placeholder="hs01,123456,Nguyễn Văn A"></textarea><div class="nav"><button class="btn" id="badd">Tạo các tài khoản</button></div></details>
    <div class="msg" id="am"></div></div>
   <div class="panel"><h3>Danh sách tài khoản (${rows.length})</h3>${rows.length?`<div class="tbl"><table><tr><th>Tên đăng nhập</th><th>Họ tên</th><th>Quyền</th><th>Hạn</th><th>Trạng thái</th><th></th></tr>
    ${rows.map(v=>`<tr><td><b>${esc(v.u)}</b></td><td>${esc(v.n)}</td><td>${(v.r||[]).map(x=>EXAMS[x]?EXAMS[x].name:x).join(", ")}</td><td>${esc(v.e||"–")}</td><td>${v.lock?"Đang khóa":"Hoạt động"}</td>
    <td style="white-space:nowrap"><button class="btn ghost sm" data-a="pw" data-u="${esc(v.u)}">Đổi mật khẩu</button> <button class="btn ghost sm" data-a="lock" data-u="${esc(v.u)}">${v.lock?"Mở khóa":"Khóa"}</button> <button class="btn ghost sm" data-a="del" data-u="${esc(v.u)}">Xóa</button></td></tr>`).join("")}</table></div>`:`<p style="color:var(--mute)">Chưa có tài khoản nào.</p>`}</div>
   <div class="panel"><h3>Kết quả thi của mọi máy (${res.length} bài gần nhất)</h3>
    <div class="nav" style="margin:0 0 10px"><button class="btn ghost sm" id="sheet">Mở Google Sheet kết quả</button><button class="btn ghost sm" id="csv">Tải CSV</button></div>
    ${histTable(res.slice().reverse().slice(0,300),true)}</div>
   <div class="panel"><h3>Đổi mật khẩu quản trị</h3><div class="row2"><div><label class="l">Mật khẩu mới</label><input class="in" id="ap" type="password"></div><div><label class="l">Nhập lại</label><input class="in" id="ap2" type="password"></div></div><div class="nav"><button class="btn" id="apb">Lưu mật khẩu</button></div><div class="msg" id="apm"></div></div>
  </div>`;
  bindOut();
  $("#try").onclick=()=>viewHome();
  const roles=()=>[...($("#r1").checked?["vact"]:[]),...($("#r2").checked?["vsat"]:[])];
  const sendAdd=async list=>{busy(true,"Đang tạo tài khoản…");const r=await api("addUsers",{list,roles:roles(),exp:$("#ne").value||""});busy(false);
    if(!r.ok){$("#am").className="msg e";$("#am").textContent=r.err;return;}
    if(r.errors&&r.errors.length)alert("Đã tạo "+r.added+" tài khoản.\nKhông tạo được:\n"+r.errors.join("\n"));viewAdmin();};
  $("#add").onclick=()=>sendAdd([{u:$("#nu").value,p:$("#np").value,n:$("#nn").value}]);
  $("#badd").onclick=()=>{const list=$("#bulk").value.split(/\n/).map(x=>x.trim()).filter(Boolean).map(ln=>{const [u,p,...n]=ln.split(/\t|,/);return {u:(u||"").trim(),p:(p||"").trim(),n:n.join(" ").trim()};});if(list.length)sendAdd(list);};
  app().querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{const u=b.dataset.u,a=b.dataset.a;let r;
    if(a==="pw"){const p=prompt("Mật khẩu mới cho "+u+" (tối thiểu 4 ký tự):");if(!p)return;busy(true);r=await api("setPw",{u,p});}
    if(a==="lock"){busy(true);r=await api("lock",{u});}
    if(a==="del"){if(!confirm("Xóa tài khoản "+u+"? Kết quả thi cũ vẫn giữ trong Sheet."))return;busy(true);r=await api("del",{u});}
    busy(false);if(r&&!r.ok)return alert(r.err);if(a==="pw")alert("Đã đổi mật khẩu cho "+u+".");viewAdmin();});
  $("#sheet").onclick=async()=>{const r=await api("sheetUrl");if(r.ok)window.open(r.url,"_blank");else alert(r.err);};
  $("#csv").onclick=()=>{const head="Thời gian,Tài khoản,Họ tên,Kỳ thi,Đề,Điểm,Tối đa,Phút";const lines=res.map(r=>[r.date,r.u,r.n,EXAMS[r.exam]?EXAMS[r.exam].name:r.exam,r.de,r.score,r.max,r.minutes].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(","));download("ket-qua-thi.csv","\ufeff"+head+"\n"+lines.join("\n"),"text/csv");};
  $("#apb").onclick=async()=>{const p=$("#ap").value,p2=$("#ap2").value,m=$("#apm");if(p!==p2){m.className="msg e";m.textContent="Hai lần nhập không khớp.";return;}const r=await api("adminPw",{p});m.className="msg "+(r.ok?"o":"e");m.textContent=r.ok?"Đã lưu mật khẩu quản trị mới.":r.err;if(r.ok)ADMIN_DEF=false;};
}
/* ================= KHỞI ĐỘNG ================= */
(async function(){
  if(!TOKEN)return viewLogin();
  app().innerHTML=`<div class="wrap"><p>Đang kết nối máy chủ…</p></div>`;
  const r=await api("me");
  if(!r.ok){ls.del(K.tok);TOKEN="";return viewLogin();}
  ME=r.user;ADMIN_DEF=!!r.adminDefault;flushPending();ME.admin?viewAdmin():viewHome();
})();
</script>
